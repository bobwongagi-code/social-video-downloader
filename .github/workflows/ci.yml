name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg for media integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compile Python files
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Check shell scripts
        run: bash -n scripts/compress_for_whatsapp.sh

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate repository metadata
        run: python3 scripts/validate_repo.py

      - name: Check diff formatting
        run: git diff --check

  macos-media:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg for media integration tests
        run: brew install ffmpeg

      - name: Run macOS shell and media tests
        run: |
          bash -n scripts/compress_for_whatsapp.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
